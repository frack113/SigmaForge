name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Run ruff check
        run: uv run ruff check main.py src/ tests/ scripts/
      - name: Run ruff format check
        run: uv run ruff format --check main.py src/ tests/ scripts/
      - name: Biome check
        run: npx -y @biomejs/biome@2.5.1 check src/presentation/static/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Run mypy
        run: uv run mypy src/ --no-error-summary

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Run pytest
        run: |
          uv run pytest tests/ -q \
            -m "not e2e" \
            --ignore tests/e2e \
            --deselect tests/unit/application/documents/test_sigma_ref_downloader.py \
            --deselect tests/unit/application/documents/test_sigma_ref_paths.py \
            --deselect tests/unit/application/documents/test_sigma_ref_url.py \
            --deselect tests/unit/back/qdrant/test_auto_start.py \
            --deselect tests/unit/back/qdrant/test_downloader.py \
            --deselect tests/unit/back/rag/test_fusion_retriever.py \
            --deselect tests/unit/back/rag/test_search.py

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install Playwright browser
        run: uv run playwright install --with-deps chromium
      - name: Run e2e tests
        run: uv run pytest tests/e2e -q -m e2e
