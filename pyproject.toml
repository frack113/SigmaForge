[project]
name = "sigmaforge"
version = "0.1.0"
description = "Local RAG system for Sigma rules"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22",
    "docx2txt>=0.9",
    "duckdb>=1.5.4",
    "fastapi>=0.139.0",
    "gitpython>=3.1.50",
    "hf-xet>=1.5.1",
    "httpx>=0.28.1",
    "huggingface-hub>=1.22.0",
    "jinja2>=3.1.6",
    "llama-index>=0.14.23",
    "llama-index-embeddings-huggingface>=0.7.0",
    "llama-index-llms-openai-like>=0.7.2",
    "llama-index-readers-file>=0.6.0",
    "llama-index-vector-stores-qdrant>=0.10.2",
    "qdrant-client>=1.18.0",
    "portalocker>=3.2",
    "puremagic>=2.2.0",
    "pymupdf>=1.28.0",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tomli-w>=1.2.0",
    "uvicorn>=0.49.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["*.sql"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
ignore_missing_imports = true


[[tool.mypy.overrides]]
module = "fastapi"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pydantic"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "qdrant_client"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "llama_index"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "huggingface_hub"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["."]
markers = [
    "e2e: end-to-end UI tests that start a live server and browser",
]

[dependency-groups]
dev = [
    "mypy",
    "playwright>=1.48",
    "pre-commit>=4.6.0",
    "pytest-playwright>=0.6",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff",
    "types-pyyaml>=6.0.12.20260518",
]


